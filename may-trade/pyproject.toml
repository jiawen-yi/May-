[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "may-trade"
version = "0.1.0"
description = "Dry-run decision and order-intent engine for a US short-swing sleeve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
may-trade = "may_trade.cli:main"

[tool.setuptools.packages.find]
include = ["may_trade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
